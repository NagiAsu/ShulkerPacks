# NagiAsu fork: shulker boxes only open from the player's own inventory (or from the hand, see canopeninair).
# A box in the lower half of the screen opens while a vanilla screen is up - a chest, barrel, furnace, anvil,
# grindstone and so on. A box inside the container never opens, and neither does one while a plugin GUI is up.
# canopeninchests, canopeninenderchest, canopeninbarrels, canopeninvirtualinventory, blacklistedinventories and
# open-previous-inventory from older versions are ignored.

canopeninair: true            #false will prevent users from opening shulkerboxes by right clicking the air (also needs shulkerpacks.open_in_air)
canopenininventory: true      #false will prevent users from opening shulkerboxes in their inventory (also needs shulkerpacks.open_in_inventory)
canplaceshulker: true         #false will prevent users from placing shulkerboxes by accident

# true will prevent users from opening shulkerboxes within 7 seconds of being hit by a player
disable-in-combat: false

# cooldown for opening shulkers in milliseconds
shulker_open_cooldown: 100

defaultname: "&0Shulker Box"
shiftclicktoopen: false # applies to opening in the inventory
shulkervolume: 1              #0.1 is quiet, 1 is loud
